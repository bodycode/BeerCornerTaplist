<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Beer Corner Mobile Menu</title>

  /css/style.css

  <style>
    html,
    body {
      overflow-x: hidden;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body.popup-open {
      overflow: hidden;
    }

    .container {
      max-width: 100%;
      padding: 10px;
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      font-size: 22px;
      margin: 10px 0;
      letter-spacing: 2px;
    }

    .image-wrapper {
      width: 100%;
      max-width: 100vw;
    }

    #menuImage {
      display: block !important;
      width: 100% !important;
      max-width: calc(100vw - 25px) !important;
      height: auto !important;
      max-height: none !important;
      margin: 0 auto !important;
      object-fit: contain !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    @media (min-width: 768px) {
      #menuImage {
        max-width: 520px !important;
      }
    }

    .footer {
      font-size: 20px;
      margin-top: 10px;
      opacity: 0.3;
      letter-spacing: 1px;
    }

    img {
      touch-action: manipulation;
    }

    /* Event popup */

    .event-popup[hidden] {
      display: none !important;
    }

    .event-popup {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.88);
      overflow-y: auto;
    }

    .event-popup-panel {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    .event-popup-link {
      display: block;
      width: 100%;
      text-decoration: none;
    }

    .event-popup-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100vh - 50px);
      object-fit: contain;
      border: 3px solid #fff;
      box-sizing: border-box;
      box-shadow: 0 12px 45px rgba(0, 0, 0, 0.65);
    }

    .event-popup-close {
      position: absolute;
      top: -14px;
      right: -14px;
      z-index: 2;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #000;
      color: #fff;
      font-size: 28px;
      line-height: 36px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
    }

    .event-popup-close:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    @media (max-width: 420px) {
      .event-popup {
        padding: 14px;
      }

      .event-popup-close {
        top: -10px;
        right: -8px;
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>

<body data-image-id="mobile">

  <div class="container">
    <h1>BEER CORNER<br>TAPLIST</h1>

    <div class="image-wrapper">
      /uploads/mobile.png
    </div>

    <div class="footer">
      WE’VE GOT'EM<br>CORNERED!!!
    </div>
  </div>

  <!-- Event popup -->
  <div
    id="eventPopup"
    class="event-popup"
    role="dialog"
    aria-modal="true"
    aria-label="Beer Corner event"
    hidden>
